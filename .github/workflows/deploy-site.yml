name: Deploy Site to DreamHost

on:
  workflow_dispatch: # Allows manual trigger
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to DreamHost via SFTP (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "set sftp:auto-confirm yes; open sftp://${FTP_USERNAME}:${FTP_PASSWORD}@${FTP_SERVER}; mirror -R -x ^\.git/ -x ^\.github/ -x ^intel/data/ ./ ./jongrayson.com/; put -O ./jongrayson.com/intel/data/ intel/data/ontology.json intel/data/starlink-seed.json intel/data/globe-demo-locations.json intel/data/intel-signals.json intel/data/intel-analytics.json intel/data/intel-tasks.json intel/data/air-traffic-cache.json" 
