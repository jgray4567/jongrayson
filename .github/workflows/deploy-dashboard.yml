name: Deploy Dashboard to DreamHost

on:
  workflow_dispatch:

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Dashboard to DreamHost via SFTP (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "set sftp:auto-confirm yes; open sftp://${FTP_USERNAME}:${FTP_PASSWORD}@${FTP_SERVER}; mirror -R ./command/ ./jongrayson.com/command/"
